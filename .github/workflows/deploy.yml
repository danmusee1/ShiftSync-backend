# ============================================================
#  GitHub Actions — NestJS → VPS (Docker + SSH)
#  Builds a container image in CI, ships it to the VPS over the
#  existing SSH connection (docker save | ssh | docker load), and
#  runs it there. No registry, no extra credentials beyond SSH.
# ============================================================

name: Deploy

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── STAGE 1 — VALIDATE ────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'
      - run: node -v
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test

  # ── STAGE 2 — BUILD IMAGE ─────────────────────────────────
  build:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t shiftsync-backend:${{ github.sha }} .

      - name: Save image to a tarball
        run: docker save shiftsync-backend:${{ github.sha }} | gzip > shiftsync-backend.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: shiftsync-backend.tar.gz
          retention-days: 1

  # ── STAGE 3 — DEPLOY ──────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: .

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship image to the VPS
        run: |
          rsync -avz \
            -e "ssh -p ${{ secrets.VPS_PORT }} -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            shiftsync-backend.tar.gz \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Load image, migrate, restart container
        env:
          IMAGE_TAG: shiftsync-backend:${{ github.sha }}
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "IMAGE_TAG='$IMAGE_TAG' bash -s" << 'REMOTE'
              set -e
              cd "${{ secrets.DEPLOY_PATH }}"

              echo "-> Loading Docker image..."
              docker load < shiftsync-backend.tar.gz
              rm -f shiftsync-backend.tar.gz

              echo "-> Running Prisma migrations..."
              docker run --rm --network host --env-file .env "$IMAGE_TAG" npx prisma migrate deploy

              echo "-> Retiring the old PM2-managed process, if it's still hanging around..."
              pm2 delete shiftsync-api 2>/dev/null || true
              pm2 save 2>/dev/null || true

              echo "-> Stopping previous container (if any)..."
              docker stop shiftsync-api 2>/dev/null || true
              docker rm shiftsync-api 2>/dev/null || true

              echo "-> Starting new container..."
              # log-opt caps json-file logs at 30MB total (10MB x 3 files) instead
              # of growing unbounded — `docker logs` still works exactly the same.
              docker run -d --name shiftsync-api --network host --restart unless-stopped \
                --log-opt max-size=10m --log-opt max-file=3 \
                --env-file .env "$IMAGE_TAG"

              echo "-> Waiting for health check..."
              for i in $(seq 1 15); do
                if curl -fsS http://127.0.0.1:4000/health > /dev/null 2>&1; then
                  echo "Health check passed."
                  break
                fi
                if [ "$i" = 15 ]; then
                  echo "Health check failed after 15 attempts — check 'docker logs shiftsync-api'."
                  exit 1
                fi
                sleep 2
              done

              echo "-> Pruning old images (keeping the 3 most recent for quick rollback)..."
              docker image prune -f > /dev/null 2>&1 || true
              docker images shiftsync-backend --format '{{.Tag}}' | tail -n +4 | \
                xargs -r -I{} docker rmi "shiftsync-backend:{}" 2>/dev/null || true

              echo "Deploy complete - $(date)"
          REMOTE
