services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shiftsync
      POSTGRES_PASSWORD: shiftsync
      POSTGRES_DB: shiftsync
    ports:
      - '5432:5432'
    volumes:
      - shiftsync_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shiftsync']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - shiftsync_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: the app itself, built from the same Dockerfile used in
  # production — for full-stack parity testing. Day-to-day development is
  # faster via `npm run start:dev` against the postgres/redis services above;
  # this is for verifying the container image itself works end-to-end.
  # Run migrations first: `docker compose run --rm app npx prisma migrate deploy`
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: 'postgresql://shiftsync:shiftsync@postgres:5432/shiftsync?schema=public'
      REDIS_URL: 'redis://redis:6379'
    ports:
      - '3000:3000'
    profiles: [app]

volumes:
  shiftsync_postgres_data:
  shiftsync_redis_data:
